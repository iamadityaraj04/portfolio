<section id="contact" class="section contact-section">
    <div class="container text-center">
        <h2 class="section-title">Get In Touch</h2>
        <p class="contact-text">
            I'm currently looking for new opportunities. Whether you have a question or just want to say hi, I'll try my
            best to get back to you!
        </p>
        <a [href]="'mailto:' + data.email" class="btn btn-large">Say Hello</a>
        <a [href]="data.resumeUrl" target="_blank" class="btn btn-large">Download Resume</a>

        <div class="social-links">
            <a [href]="data.links.github" target="_blank">GitHub</a>
            <a [href]="data.links.linkedin" target="_blank">LinkedIn</a>
        </div>
    </div>
</section>
